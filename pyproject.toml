[project]
name = "pkg-re"
version = "0.1.0"
description = "Local package photo reconstruction workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "python-multipart>=0.0.18,<1",
  "pydantic>=2.10,<3", "numpy>=2,<3", "opencv-python-headless>=4.10,<5",
  "scipy>=1.14,<2", "shapely>=2.0,<3", "pillow>=11,<13", "pytesseract>=0.3.13,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
